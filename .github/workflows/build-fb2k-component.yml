name: Build foo_super_eq

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and Run Core DSP Tests
        run: make test && make cli

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and Run Windows Core Tests
        shell: pwsh
        run: |
          cmake -S . -B build-tests -A x64
          cmake --build build-tests --config Release --target super_eq_tests super_eq_cli
          .\build-tests\Release\super_eq_tests.exe

      - name: Download foobar2000 SDK and WTL
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path deps | Out-Null
          $sdkPage = Invoke-WebRequest -Uri "https://www.foobar2000.org/SDK" -UseBasicParsing
          $sdkLink = ($sdkPage.Links | Where-Object { $_.href -match "SDK.*\.7z$" } | Select-Object -First 1).href
          if (-not $sdkLink.StartsWith("http")) {
            $sdkLink = "https://www.foobar2000.org" + $sdkLink
          }
          Invoke-WebRequest -Uri $sdkLink -OutFile deps/fb2k_sdk.7z
          7z x deps/fb2k_sdk.7z -odeps/fb2k_sdk -y | Out-Null

          git clone --depth 1 https://github.com/Win32-WTL/WTL.git deps/wtl
          Copy-Item -Path "deps/wtl/Include/*" -Destination "deps/fb2k_sdk" -Recurse -Force

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Compile SDK + Component (x64 & Win32)
        shell: pwsh
        run: |
          $sdkDir = (Resolve-Path deps/fb2k_sdk).Path
          $wtlDir = (Resolve-Path deps/wtl/Include).Path
          $sdkProjects = @(
            "$sdkDir/pfc/pfc.vcxproj",
            "$sdkDir/foobar2000/SDK/foobar2000_SDK.vcxproj",
            "$sdkDir/foobar2000/helpers/foobar2000_sdk_helpers.vcxproj",
            "$sdkDir/foobar2000/foobar2000_component_client/foobar2000_component_client.vcxproj",
            "$sdkDir/libPPUI/libPPUI.vcxproj"
          )

          foreach ($arch in @(@{msbuild="x64"; cmake="x64"; out="pkg/x64"}, @{msbuild="Win32"; cmake="Win32"; out="pkg"})) {
            $libDir = Join-Path $PWD "deps/sdk-libs-$($arch.msbuild)"
            New-Item -ItemType Directory -Force -Path $libDir | Out-Null
            Copy-Item "$sdkDir/foobar2000/shared/shared-$($arch.msbuild).lib" "$libDir/shared.lib" -Force

            $bdir = "build-fb2k-$($arch.cmake)"
            cmake -S . -B $bdir -A $($arch.cmake) -DFB2K_SDK_DIR="$sdkDir" -DWTL_INCLUDE_DIR="$wtlDir" -DFB2K_SDK_LIB_DIR="$libDir"

            $toolsetMatch = Select-String -Path "$bdir/CMakeCache.txt" -Pattern "^CMAKE_VS_PLATFORM_TOOLSET:INTERNAL=(.+)$"
            $toolsetProp = if ($toolsetMatch) { "/p:PlatformToolset=$($toolsetMatch.Matches[0].Groups[1].Value)" } else { "" }

            foreach ($proj in $sdkProjects) {
              msbuild $proj /p:Configuration=Release /p:Platform=$($arch.msbuild) $toolsetProp /p:WholeProgramOptimization=false /p:OutDir="$libDir\" /m
            }

            cmake --build $bdir --config Release --target foo_super_eq
            New-Item -ItemType Directory -Force -Path $arch.out | Out-Null
            Copy-Item "$bdir/Release/foo_super_eq.dll" "$($arch.out)/foo_super_eq.dll" -Force
          }

          Compress-Archive -Path pkg/* -DestinationPath foo_super_eq.fb2k-component -Force

      - name: Upload .fb2k-component Artifact
        uses: actions/upload-artifact@v4
        with:
          name: foo_super_eq.fb2k-component
          path: foo_super_eq.fb2k-component
